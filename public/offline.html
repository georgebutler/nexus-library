<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <title>Offline · Nexus Library</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #080b12;
        color: #f7f8fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(28rem, calc(100% - 2rem));
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        color: #9da6b8;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nexus Library is offline</h1>
      <p>Reconnect to load the game catalog. Your saved collections remain stored on this device.</p>
    </main>
  </body>
</html>
